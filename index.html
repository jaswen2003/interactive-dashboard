<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Interactive Dashboard</title>
        <!-- Bootstrap  -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <!-- Link external CSS -->
        <link rel="stylesheet" href="css/style.css">
        <!-- Source external JavaScript-->
        <!-- Remove external JavaScript -->
    </head>
    <body>
        <h1>My Interactive Dashboard</h1>
        <p>This dashboard was created by Jason Wendel for the WEB-115 course at Wake Tech</p>
        <script>
            document.write('This dashboard demonstrates how JavaScript can be used to create interactive websites.')
        </script>
        <!-- The <noscript> is for web browsers with JavaScript rendering disabled. -->
        <noscript>
            Unfortunately, your web browser does not support JavaScript.
        </noscript>
        <div class="container">
            <div class="row">
                <!-- Dashboard Content -->
                 <div class="col" id="weekly-tasks">
                    <!-- Insert script for task form -->
                    <script src="js/task-manager.js" defer></script>
                    <!-- Create task form -->
                    <form>
                        <!-- Name input field -->
                        Name:
                        <input type="text" id="name">
                        <!-- Daily Task Goal input field with "daily" id -->
                        Daily Task Goal:
                        <input type="number" id="daily">
                        <!-- Weekly Bonus Goal input field with "bonus" id -->
                        Weekly Bonus Goal:
                        <input type="number" id="bonus">
                        
                        <div>
                        <!-- Button element with 'goal-btn' id -->
                        <button id="goal-btn">Submit</button>
                        </div>
                    </form>
                    <!-- Paragraph element for function output with "goal-message" id -->
                    <p id="goal-message"></p>
                 </div>
                 <div class="col" id="metric-converter">
                    <!-- Insert script for converter -->
                    <script src="js/metric-converter.js" defer></script>
                    <!-- Create conversion form -->
                    <form>
                        <!-- Input for numeric value to be converted -->
                        Value:
                        <input type="number" id="value">
                        <!-- Selection list for conversion type -->
                        Conversion Type:
                        <select id="type">
                            <option value="in to cm">Inches to Centimeters</option>
                            <option value="ft to cm">Feet to Centimeters</option>
                            <option value="yd to m">Yards to Meters</option>
                            <option value="mi to km">Miles to Kilometers</option>
                            <option value="cm to in">Centimeters to Inches</option>
                            <option value="cm to ft">Centimeters to Feet</option>
                            <option value="m to yd">Meters to Yards</option>
                            <option value="km to mi">Kilometers to Miles</option>
                        </select>
                        <!-- Button element for conversion -->
                        <div>
                            <button id="convert-btn">Convert</button>
                        </div>
                    </form>
                    <!-- Paragraph element for function output -->
                    <p id="conversion"></p>
                 </div>
            </div>
        </div>
    </body>
</html>
